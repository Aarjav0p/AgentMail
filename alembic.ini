[alembic]
# path to migration environment
script_location = relay/models/migrations

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# sys.path prepend — project root so "relay.*" imports work
prepend_sys_path = .

# empty — overridden in env.py from relay.config.settings
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
