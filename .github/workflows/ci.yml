name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentmail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentmail_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentmail_test
      ENCRYPTION_KEY: aW5pdGlhbC10ZXN0LWtleS0zMi1ieXRlcy1sb25nISE=
      SUPABASE_JWT_SECRET: test-supabase-jwt-secret-at-least-32-chars-long
      SUPABASE_URL: https://test-project.supabase.co

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
